railpartner_360:

  target: dev

  outputs:

    dev:

      type: postgres

      host: "{{ env_var('DB_HOST', 'localhost') }}"

      port: "{{ env_var('DB_PORT', '5433') | int }}"

      user: "{{ env_var('DB_USER', 'postgres') }}"

      password: YOUR_POSTGRES_PASSWORD

      dbname: "{{ env_var('DB_NAME', 'railpartner360') }}"

      schema: staging

      threads: 4

      keepalives_idle: 0

      connect_timeout: 10
